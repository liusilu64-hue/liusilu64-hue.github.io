<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d3028" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta
      name="description"
      content="钢铁前线：可离线游玩的3D坦克战术演训。驾驶、瞄准，与电脑车组并肩作战。"
    />
    <link rel="manifest" href="/steel-frontline-ipad/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/steel-frontline-ipad/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/steel-frontline-ipad/icons/apple-touch-icon.png" />
    <title>钢铁前线 · 离线坦克演训</title>
    <script type="module" crossorigin src="/steel-frontline-ipad/assets/index-Dc1PGiit.js"></script>
    <link rel="stylesheet" crossorigin href="/steel-frontline-ipad/assets/index-C1zPwCql.css">
  </head>
  <body>
    <div id="root">
      <div
        id="boot-status"
        style="
          padding: 40px;
          color: #e6b96e;
          font:
            16px -apple-system,
            sans-serif;
        "
      >
        钢铁前线 · 正在载入战场…
      </div>
    </div>
    <script>
      (function () {
        var root = document.getElementById("root");
        var nativeApp = "false" === "true";
        function failed() {
          if (!document.getElementById("boot-status")) return;
          root.innerHTML = nativeApp
            ? '<section id="boot-status" style="max-width:480px;margin:12vh auto;padding:32px;color:#e5e9dd;font:15px/1.8 -apple-system,sans-serif"><h1 style="font-size:24px">游戏资源未完整载入</h1><p>请从这台 Mac 重新安装钢铁前线应用。</p><button id="repair-game" style="padding:14px 24px;background:#e6b96e;border:0;font:inherit">重新打开</button></section>'
            :
            '<section id="boot-status" style="max-width:480px;margin:12vh auto;padding:32px;color:#e5e9dd;font:15px/1.8 -apple-system,sans-serif"><h1 style="font-size:24px">游戏资源未完整载入</h1><p>请先联网，再点击修复。你的本地战绩会保留。</p><button id="repair-game" style="padding:14px 24px;background:#e6b96e;border:0;font:inherit">联网修复并重新打开</button><p id="repair-status" style="font-size:12px"></p></section>';
          document.getElementById("repair-game").onclick = async function () {
            if (nativeApp) { location.reload(); return; }
            var msg = document.getElementById("repair-status");
            this.disabled = true;
            try {
              if ("serviceWorker" in navigator) {
                var reg = await navigator.serviceWorker.getRegistration();
                if (reg) {
                  await reg.update();
                  if (reg.installing) {
                    await new Promise(function (resolve, reject) {
                      var w = reg.installing;
                      var timeout = setTimeout(function () {
                        reject(new Error("下载超时，请检查网络后重试。"));
                      }, 45000);
                      w.addEventListener("statechange", function () {
                        if (w.state === "installed") {
                          clearTimeout(timeout);
                          resolve();
                        } else if (w.state === "redundant") {
                          clearTimeout(timeout);
                          reject(new Error("资源下载失败，请检查网络后重试。"));
                        }
                      });
                    });
                  }
                  if (reg.waiting) {
                    navigator.serviceWorker.addEventListener(
                      "controllerchange",
                      function () {
                        location.reload();
                      },
                      { once: true },
                    );
                    reg.waiting.postMessage({ type: "SKIP_WAITING" });
                    return;
                  }
                }
              }
              location.reload();
            } catch (e) {
              msg.textContent = e.message || "暂时无法修复，请联网后重试。";
              this.disabled = false;
            }
          };
        }
        addEventListener(
          "error",
          function (e) {
            if (e.target && e.target.tagName === "SCRIPT") failed();
          },
          true,
        );
        setTimeout(failed, 12000);
      })();
    </script>
  </body>
</html>
